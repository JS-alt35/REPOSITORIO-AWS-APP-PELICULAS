name: Construir y desplegar API Spring Boot

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Crear JAR Spring Boot
        run: mvn clean package -DskipTests

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Docker
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/api-catalogo-aws:latest \
            .

      - name: Subir imagen a Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/api-catalogo-aws:latest

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            docker network create catalogo-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/api-catalogo-aws:latest

            docker stop api-catalogo || true
            docker rm api-catalogo || true

            docker run -d \
              --name api-catalogo \
              --restart unless-stopped \
              --network catalogo-network \
              -p 8082:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://catalogo-database:5432/catalogo_db \
              -e SPRING_DATASOURCE_USERNAME=postgres \
              -e SPRING_DATASOURCE_PASSWORD=root \
              ${{ secrets.DOCKER_USERNAME }}/api-catalogo-aws:latest
