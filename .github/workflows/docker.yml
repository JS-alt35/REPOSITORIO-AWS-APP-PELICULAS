name: Construir y desplegar Frontend Angular

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación Angular
        run: npm run build

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app-catalogo-aws:latest

      - name: Desplegar frontend en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker network create catalogo-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/app-catalogo-aws:latest

            docker stop app-catalogo || true
            docker rm app-catalogo || true

            docker run -d \
              --name app-catalogo \
              --restart unless-stopped \
              --network catalogo-network \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/app-catalogo-aws:latest
